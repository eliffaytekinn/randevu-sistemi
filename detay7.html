<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Randevu Al - {{ service.name }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .icon { font-size: 50px; margin-bottom: 10px; display: block; }
        h2 { color: #2c3e50; margin: 0 0 10px 0; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        
        /* Tüm kutular (input ve select) aynı tipte görünsün */
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: white; }
        
        .btn-book { background-color: #e74c3c; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-book:hover { background-color: #c0392b; }
        
        .alert { background: #ffeaa7; color: #d35400; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
        .back-link { display: block; margin-top: 20px; text-decoration: none; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <span class="icon">{{ service.icon }}</span>
        <h2>{{ service.name }}</h2>
        <p>{{ service.desc }}</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form action="/book/{{ service.id }}" method="POST">
            <input type="text" name="customer_name" placeholder="Adınız Soyadınız" required>
            
            <input type="tel" name="phone" placeholder="Telefon (05xxxxxxxxx)" required maxlength="11">

            <select name="professional_id" required>
                <option value="" disabled selected>Uzman Seçiniz...</option>
                {% for prof in professionals %}
                <option value="{{ prof.id }}">{{ prof.name }}</option>
                {% endfor %}
            </select>

            <label style="font-size:12px; color:#666; display:block; text-align:left; margin-top:5px;">Tarih Seçiniz:</label>
            <select name="randevu_tarihi" id="tarihListesi" required>
                </select>

            <label style="font-size:12px; color:#666; display:block; text-align:left;">Saat Seçiniz:</label>
            <select name="randevu_saati" required>
                <option value="" disabled selected>Saat Aralığı Seçiniz...</option>
                <option value="08:00 - 09:00">08:00 - 09:00</option>
                <option value="09:00 - 10:00">09:00 - 10:00</option>
                <option value="10:00 - 11:00">10:00 - 11:00</option>
                <option value="11:00 - 12:00">11:00 - 12:00</option>
                <option value="13:00 - 14:00">13:00 - 14:00</option>
                <option value="14:00 - 15:00">14:00 - 15:00</option>
                <option value="15:00 - 16:00">15:00 - 16:00</option>
                <option value="16:00 - 17:00">16:00 - 17:00</option>
                <option value="17:00 - 18:00">17:00 - 18:00</option>
            </select>

            <button type="submit" class="btn-book">Randevuyu Onayla</button>
        </form>

        <a href="/" class="back-link">⬅ İptal ve Geri Dön</a>
    </div>

    <script>
        var selectKutusu = document.getElementById("tarihListesi");
        var bugun = new Date();

        // 20 Günlük döngü
        for (var i = 0; i < 20; i++) {
            var gelecekGun = new Date();
            gelecekGun.setDate(bugun.getDate() + i);

            // Eğer gün Pazar (0) ise listeye ekleme, atla!
            if (gelecekGun.getDay() !== 0) { 
                
                // Tarihi gg.aa.yyyy formatına çevir
                var gun = String(gelecekGun.getDate()).padStart(2, '0');
                var ay = String(gelecekGun.getMonth() + 1).padStart(2, '0');
                var yil = gelecekGun.getFullYear();
                var tarihYazisi = gun + "." + ay + "." + yil;

                // Kutuya ekle
                var secenek = document.createElement("option");
                secenek.text = tarihYazisi;
                secenek.value = tarihYazisi;
                selectKutusu.add(secenek);
            }
        }
    </script>

</body>
</html>
