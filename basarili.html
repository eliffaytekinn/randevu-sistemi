<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Randevu Alındı ✅</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .success-box { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .icon { font-size: 80px; color: #2ecc71; margin-bottom: 20px; display: block; }
        h1 { color: #2c3e50; margin: 0 0 10px 0; }
        p { color: #7f8c8d; line-height: 1.6; margin-bottom: 30px; }
        .btn-home { background: #3498db; color: white; text-decoration: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; display: inline-block; transition: 0.2s; }
        .btn-home:hover { background: #2980b9; }
        .note { font-size: 13px; color: #95a5a6; margin-top: 20px; display: block; }
    </style>
</head>
<body>

    <div class="success-box">
        <span class="icon">✅</span>
        <h1>Tebrikler!</h1>
        <p>Randevunuz başarıyla oluşturuldu. Uzmanımız seçtiğiniz saatte sizi bekliyor olacak.</p>
        
        <a href="/" class="btn-home">Ana Sayfaya Dön</a>

        <span class="note">Randevunuzu sorgulamak veya iptal etmek için menüden "Randevularım" kısmını kullanabilirsiniz.</span>
    </div>

</body>
</html>
